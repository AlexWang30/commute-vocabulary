const unique=[]; const seenWords=new Set(); for(const w of words){const k=w[0].toLowerCase();if(!seenWords.has(k)){seenWords.add(k);unique.push(w)}}
let mode='en', focus=false, order=[], pos=0, revealed=false, typedChecked=false;
let knownSet=new Set(JSON.parse(localStorage.getItem('commuteKnown')||'[]'));
let seenSet=new Set(JSON.parse(localStorage.getItem('commuteSeen')||'[]'));
function save(){localStorage.setItem('commuteKnown',JSON.stringify([...knownSet]));localStorage.setItem('commuteSeen',JSON.stringify([...seenSet]))}
function makeOrder(shuffle=false){order=unique.map((_,i)=>i).filter(i=>!focus||unique[i][2]);if(shuffle)order.sort(()=>Math.random()-.5);pos=0;render()}
function current(){return unique[order[pos]??0]}
function render(){
 if(!order.length){document.getElementById('prompt').textContent='暂无重点词';return}
 const w=current(), id=w[0].toLowerCase(), isZh=mode==='zh', isType=mode==='type';
 document.getElementById('seen').textContent=seenSet.size;document.getElementById('known').textContent=knownSet.size;document.getElementById('left').textContent=Math.max(0,order.length-pos);
 document.getElementById('bar').style.width=(order.length?pos/order.length*100:0)+'%';
 document.getElementById('counter').textContent=`第 ${pos+1} / ${order.length} 题`;
 document.getElementById('tag').textContent=w[2]?'⭐ 荧光重点':'普通词';document.getElementById('tag').className='tag'+(w[2]?' hot':'');
 document.getElementById('prompt').textContent=isZh?w[1]:w[0];document.getElementById('hint').textContent=isType?'根据中文写出英文拼写':(isZh?'看中文，回忆英文拼写':'先想一想中文意思，再揭晓答案');
 document.getElementById('answerArea').style.display='none';document.getElementById('answer').textContent=isZh?w[0]:w[1];document.getElementById('extra').textContent=isType?'注意拼写；英文大小写不影响判定。':'';
 document.getElementById('typebox').style.display=isType?'block':'none';document.getElementById('typed').value='';document.getElementById('feedback').textContent='';document.getElementById('rating').style.display='none';document.getElementById('reveal').style.display=isType?'none':'block';revealed=false;typedChecked=false;
}
function reveal(){if(mode==='type'){checkTyped();return}if(revealed)return;revealed=true;document.getElementById('answerArea').style.display='block';document.getElementById('rating').style.display='grid';document.getElementById('reveal').style.display='none';seenSet.add(current()[0].toLowerCase());save();renderStats()}
function renderStats(){document.getElementById('seen').textContent=seenSet.size;document.getElementById('known').textContent=knownSet.size;document.getElementById('left').textContent=Math.max(0,order.length-pos)}
function checkTyped(){if(typedChecked)return;typedChecked=true;const w=current(),v=document.getElementById('typed').value.trim().toLowerCase(),expected=w[0].toLowerCase();const ok=v===expected;const f=document.getElementById('feedback');f.className='feedback '+(ok?'correct':'wrong');f.textContent=ok?'✓ 正确！ '+w[1]:'正确拼写：'+w[0]+'　·　'+w[1];document.getElementById('answerArea').style.display='block';document.getElementById('answer').textContent=w[0];document.getElementById('extra').textContent=w[1];document.getElementById('rating').style.display='grid';seenSet.add(expected);if(ok)knownSet.add(expected);save();renderStats()}
function next(remember){const w=current(),id=w[0].toLowerCase();if(remember)knownSet.add(id);else knownSet.delete(id);seenSet.add(id);save();if(pos<order.length-1)pos++;else{pos=0;order.sort(()=>Math.random()-.5)}render()}

document.getElementById('all').onclick=()=>{focus=false;document.getElementById('all').classList.add('active');document.getElementById('yellow').classList.remove('active');makeOrder()};
document.getElementById('yellow').onclick=()=>{focus=true;document.getElementById('yellow').classList.add('active');document.getElementById('all').classList.remove('active');makeOrder()};
document.getElementById('shuffle').onclick=()=>makeOrder(true);
document.getElementById('reveal').onclick=reveal;document.getElementById('again').onclick=()=>next(false);document.getElementById('know').onclick=()=>next(true);
document.getElementById('typed').addEventListener('keydown',e=>{if(e.key==='Enter')checkTyped()});
document.getElementById('reset').onclick=()=>{if(confirm('清空已记住和练习记录？')){knownSet.clear();seenSet.clear();save();makeOrder()}};
document.getElementById('toggleList').onclick=()=>{const p=document.getElementById('listpanel');p.classList.toggle('show');document.getElementById('toggleList').textContent=p.classList.contains('show')?'收起词表⌃':'查看词表⌄';drawList()};
document.getElementById('search').oninput=drawList;
function drawList(){const q=(document.getElementById('search').value||'').toLowerCase();const filtered=unique.filter(w=>w[0].toLowerCase().includes(q)||w[1].toLowerCase().includes(q));document.getElementById('wordlist').innerHTML=filtered.slice(0,160).map(w=>`<div class="wordrow"><strong>${w[2]?'⭐ ':''}${w[0]}</strong><small>${w[1]}</small></div>`).join('')+(filtered.length>160?'<div class="note">仅显示前160条，请继续搜索缩小范围。</div>':'')}
makeOrder();drawList();
</script></body></html>
